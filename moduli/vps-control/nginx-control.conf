# control.rescuemanager.eu → VPS Control API (localhost:3910)
# Prerequisiti:
#   1) DNS: record A  control.rescuemanager.eu → 217.154.118.37
#   2) Cert: certbot --nginx -d control.rescuemanager.eu (dopo il DNS)
# Poi: ln -s in sites-enabled, nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name control.rescuemanager.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name control.rescuemanager.eu;

    ssl_certificate     /etc/letsencrypt/live/control.rescuemanager.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/control.rescuemanager.eu/privkey.pem;

    # Solo API JSON, corpo piccolo
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:3910;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
